apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vishalsallagargi/gitops-demo.git
    targetRevision: main
    path: environments/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
