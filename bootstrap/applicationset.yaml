apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-environments
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/vishalsallagargi/gitops-demo.git
        revision: main
        directories:
          - path: environments/*

  template:
    metadata:
      name: "nginx-{{path.basename}}"
      namespace: argocd
    spec:
      project: default

      source:
        repoURL: https://github.com/vishalsallagargi/gitops-demo.git
        targetRevision: main
        path: "{{path}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "demo-{{path.basename}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
