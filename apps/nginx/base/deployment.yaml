apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx
        image: ghcr.io/vishalsallagargi/gitops-demo-nginx:latest
        ports:
        - containerPort: 80